name: One-shot baked eroded terrain

on:
  push:
    paths:
      - .github/workflows/one-shot-baked-eroded-terrain.yml

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bake terrain assets
        run: |
          mkdir -p build/terrain-baker app/src/main/assets/terrain
          javac -d build/terrain-baker core/src/main/java/com/nyerahworks/balancepoint/FastNoiseLite.java tools/TerrainBaker.java
          java -Xmx1536m -cp build/terrain-baker com.nyerahworks.balancepoint.TerrainBaker app/src/main/assets/terrain
          ls -lh app/src/main/assets/terrain

      - name: Patch terrain contact physics
        run: python3 tools/patch_baked_terrain_physics.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Android path
        run: |
          gradle :core:compileJava --stacktrace
          gradle :app:assembleDebug --stacktrace

      - name: Commit baked terrain
        run: |
          rm -f .github/workflows/one-shot-baked-eroded-terrain.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Bake eroded heightfield terrain and unify collision surface"
          git push
