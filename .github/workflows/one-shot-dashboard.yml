name: One-shot real dashboard patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-dashboard.yml"

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dashboard patch
        run: python tools/patch_real_dashboard.py

      - name: Commit patched dashboard and clean one-shot files
        run: |
          rm tools/patch_real_dashboard.py
          rm .github/workflows/one-shot-dashboard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java tools/patch_real_dashboard.py .github/workflows/one-shot-dashboard.yml
          git commit -m "Render compact dashboard directly on bike"
          git push origin HEAD:main
