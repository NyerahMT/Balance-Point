name: One-shot terrain physics
on:
  push:
    paths:
      - '.github/scripts/apply-terrain-physics.py'
      - '.github/workflows/one-shot-terrain-physics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply terrain physics and LCD mirror
        run: python3 .github/scripts/apply-terrain-physics.py
      - name: Commit fixes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/apply-terrain-physics.py
          rm .github/workflows/one-shot-terrain-physics.yml
          git add -A
          git commit -m "Add traversable foothills and mountain terrain physics"
          git push
