name: One-shot airborne pitch patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/flight_pitch_patch.py'
      - '.github/workflows/one-shot-flight-pitch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply airborne pitch patch
        run: python3 .github/scripts/flight_pitch_patch.py
      - name: Commit patch and clean one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/flight_pitch_patch.py
          rm .github/workflows/one-shot-flight-pitch.yml
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java
          git add -u .github/scripts/flight_pitch_patch.py .github/workflows/one-shot-flight-pitch.yml
          git commit -m "Preserve terrain pitch through jumps"
          git push
