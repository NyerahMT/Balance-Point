name: Apply Physics V2 Rideability

on:
  push:
    branches: [ main ]
    paths:
      - "tools/apply_physics_v2_rideability.py"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Apply Physics V2 rideability corrections
        run: python3 tools/apply_physics_v2_rideability.py

      - name: Validate corrected plant
        run: |
          python3 tools/quality_gate.py
          ./gradlew :core:test --stacktrace

      - name: Commit corrected plant
        run: |
          if git diff --quiet; then
            echo "Rideability corrections already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/PhysicsV2Plant.java \
                  core/src/main/java/com/nyerahworks/balancepoint/PhysicsV2RiderController.java \
                  core/src/test/java/com/nyerahworks/balancepoint/PhysicsV2RideabilityTest.java
          git commit -m "Correct Physics V2 force path and rider control"
          git push origin HEAD:main
