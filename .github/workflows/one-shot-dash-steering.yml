name: One-shot dash and steering fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-shot-dash-steering.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dash and steering fixes
        run: python .github/scripts/fix-dash-steering.py
      - name: Commit fixes and remove one-shot files
        run: |
          rm .github/scripts/fix-dash-steering.py
          rm .github/workflows/one-shot-dash-steering.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix dashboard visibility and steering freedom"
          git push
