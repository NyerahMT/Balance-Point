name: One-shot visual polish

on:
  push:
    paths:
      - '.github/workflows/one-shot-visual-polish.yml'
      - 'tools/patch_visual_polish.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync current main
        run: git pull --ff-only origin main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply visual polish patch
        run: python3 tools/patch_visual_polish.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile core
        run: gradle :core:compileJava --stacktrace

      - name: Commit source changes
        run: |
          rm -f .github/workflows/one-shot-visual-polish.yml tools/patch_visual_polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java \
                  core/src/main/java/com/nyerahworks/balancepoint/TerrainVisuals.java \
                  .github/workflows/one-shot-visual-polish.yml \
                  tools/patch_visual_polish.py
          git commit -m "Polish atmosphere lighting sky and vegetation"
          git push
