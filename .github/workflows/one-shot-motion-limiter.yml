name: One-shot motion damping and limiter

on:
  push:
    paths:
      - '.github/workflows/one-shot-motion-limiter.yml'
      - 'tools/patch_motion_limiter.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply motion/limiter patch
        run: python3 tools/patch_motion_limiter.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile core
        run: gradle :core:compileJava --stacktrace

      - name: Commit source changes and self-clean
        run: |
          rm -f .github/workflows/one-shot-motion-limiter.yml tools/patch_motion_limiter.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java \
                  core/src/main/java/com/nyerahworks/balancepoint/MotorcycleDrivetrain.java \
                  core/src/main/java/com/nyerahworks/balancepoint/EngineAudio.java \
                  .github/workflows/one-shot-motion-limiter.yml \
                  tools/patch_motion_limiter.py
          git commit -m "Damp chassis rotation and restore hard limiter"
          git push
