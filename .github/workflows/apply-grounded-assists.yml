name: Apply Grounded Rideability Assists

on:
  push:
    branches: [main]
    paths:
      - tools/apply_grounded_assists.py
      - .github/workflows/apply-grounded-assists.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply grounded assists
        run: python3 tools/apply_grounded_assists.py
      - name: Validate grounded assist pass
        run: |
          python3 tools/quality_gate.py
          ./gradlew :core:test --stacktrace
      - name: Commit grounded assists
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/PhysicsV2Plant.java
          git commit -m "Restore grounded rideability assists"
          git push origin main
