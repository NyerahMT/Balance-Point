name: Apply airborne physics integration

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply airborne physics integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch airborne physics and crash geometry
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java')
          s = path.read_text()

          def replace(old, new, count=1):
              global s
              if old not in s:
                  raise SystemExit('Patch anchor not found:\n' + old[:240])
              s = s.replace(old, new, count)

          replace('''    private static final float AIR_WHEEL_DRIVE_ACCEL = 115f;
    private static final float AIR_WHEEL_BRAKE_ACCEL = 220f;
    private static final float AIR_WHEEL_DRAG = 0.22f;
    private static final float AIR_PITCH_DAMPING = 0.22f;
    private static final float AIR_MAX_PITCH_RATE = 3.8f;
    private static final float AIR_WHEEL_REACTION_GAIN = 1.18f;
    private static final float AIR_RIDER_TORQUE_GAIN = 1.12f;
    private static final float AIR_CONTROL_BLEND_TIME = 0.12f;''', '''    private static final float AIR_WHEEL_DRIVE_ACCEL = 150f;
    private static final float AIR_WHEEL_BRAKE_ACCEL = 260f;
    private static final float AIR_WHEEL_DRAG = 0.22f;
    private static final float AIR_PITCH_DAMPING = 0.08f;
    private static final float AIR_MAX_PITCH_RATE = 5.2f;
    private static final float AIR_WHEEL_REACTION_GAIN = 1.32f;
    private static final float AIR_RIDER_TORQUE_GAIN = 1.30f;
    private static final float AIR_CONTROL_BLEND_TIME = 0.055f;''')

          replace('''    private static final float THROTTLE_SNAP_RATE = 12f;
    private static final float THROTTLE_SNAP_IMPULSE = 0.52f;
    private static final float LOOP_ANGLE = 155f * MathUtils.degreesToRadians;''', '''    private static final float THROTTLE_SNAP_RATE = 12f;
    private static final float THROTTLE_SNAP_IMPULSE = 0.52f;
    private static final float TAKEOFF_PITCH_RATE_LIMIT = 2.2f;
    private static final float TAKEOFF_PITCH_RATE_BLEND = 0.55f;''')

          replace('''    private final MotorcycleLandingDynamics landingDynamics = new MotorcycleLandingDynamics();''', '''    private final MotorcycleLandingDynamics landingDynamics = new MotorcycleLandingDynamics();
    private final MotorcycleBodyContact bodyContact = new MotorcycleBodyContact();''')

          replace('''    private float lastGroundSupportPitch;
    private float groundSupportPitchRate;
    private float longitudinalAcceleration;''', '''    private float lastGroundSupportPitch;
    private float groundSupportPitchRate;
    // Horizontal translation becomes a world-space ballistic vector at takeoff. This prevents
    // yaw/sideslip changes in the air from bending the actual flight path.
    private float airborneVelocityX;
    private float airborneVelocityZ;
    private float longitudinalAcceleration;''')

          replace('''        riderDynamics.step(riderLeanTarget, longitudinalAcceleration, terrainAirborne, dt);''', '''        boolean wasTerrainAirborne = terrainAirborne;
        riderDynamics.step(riderLeanTarget, longitudinalAcceleration, terrainAirborne, dt);''')

          replace('''        float rearSurfacePitch = MathUtils.atan2(
                -rearContactState.normalForward, rearContactState.normalUp);
        float frontSurfacePitch = MathUtils.atan2(
                -frontContactState.normalForward, frontContactState.normalUp);
        MotorcycleLandingDynamics.Result landingState = landingDynamics.step(''', '''        float rearSurfacePitch = MathUtils.atan2(
                -rearContactState.normalForward, rearContactState.normalUp);
        float frontSurfacePitch = MathUtils.atan2(
                -frontContactState.normalForward, frontContactState.normalUp);

        // Track the actual support-plane attitude while the tires are still on the jump. The
        // support pitch rate is the missing takeoff information: convex lips, abrupt kickers and
        // mismatched wheel release should leave the chassis with different angular momentum.
        if (!terrainAirborne) {
            float supportPitch;
            if (rearTouching && frontTouching) {
                supportPitch = MathUtils.atan2(
                        frontContactState.groundY - rearContactState.groundY, WHEELBASE);
            } else if (frontTouching) {
                supportPitch = frontSurfacePitch;
            } else {
                supportPitch = rearSurfacePitch;
            }

            if (!wasTerrainAirborne) {
                float rawSupportRate = wrapAngle(supportPitch - lastGroundSupportPitch)
                        / Math.max(dt, 0.0001f);
                rawSupportRate = MathUtils.clamp(rawSupportRate, -3.5f, 3.5f);
                groundSupportPitchRate += (rawSupportRate - groundSupportPitchRate)
                        * Math.min(1f, dt * 18f);
            } else {
                groundSupportPitchRate = 0f;
            }
            lastGroundSupportPitch = supportPitch;
        }

        if (terrainAirborne && !wasTerrainAirborne) {
            airborneVelocityX = sinYaw * speed + cosYaw * lateralSpeed;
            airborneVelocityZ = cosYaw * speed - sinYaw * lateralSpeed;

            float attitudeError = wrapAngle(lastGroundSupportPitch - pitch);
            float takeoffPitchRate = groundSupportPitchRate * 0.72f + attitudeError * 1.6f;
            takeoffPitchRate = MathUtils.clamp(
                    takeoffPitchRate, -TAKEOFF_PITCH_RATE_LIMIT, TAKEOFF_PITCH_RATE_LIMIT);
            pitchVelocity = MathUtils.lerp(
                    pitchVelocity, takeoffPitchRate, TAKEOFF_PITCH_RATE_BLEND);
        }

        MotorcycleLandingDynamics.Result landingState = landingDynamics.step(''')

          replace('''        float aero = AERO_DRAG * speed * absSpeed;''', '''        // Grounded drag follows the motorcycle longitudinal axis. In flight, drag is applied to
        // the preserved world-space horizontal velocity below so yaw cannot curve the trajectory.
        float aero = terrainAirborne ? 0f : AERO_DRAG * speed * absSpeed;''')

          replace('''        bikeX += (sinYaw * speed + cosYaw * lateralSpeed) * dt;
        bikeZ += (cosYaw * speed - sinYaw * lateralSpeed) * dt;
        chassisY += verticalVelocity * dt;''', '''        if (terrainAirborne) {
            float airHorizontalSpeed = (float) Math.sqrt(
                    airborneVelocityX * airborneVelocityX
                            + airborneVelocityZ * airborneVelocityZ);
            if (airHorizontalSpeed > 0.001f) {
                float dragRetention = Math.max(
                        0f, 1f - (AERO_DRAG * airHorizontalSpeed / MASS) * dt);
                airborneVelocityX *= dragRetention;
                airborneVelocityZ *= dragRetention;
            }
            bikeX += airborneVelocityX * dt;
            bikeZ += airborneVelocityZ * dt;
        } else {
            bikeX += (sinYaw * speed + cosYaw * lateralSpeed) * dt;
            bikeZ += (cosYaw * speed - sinYaw * lateralSpeed) * dt;
        }
        chassisY += verticalVelocity * dt;''')

          replace('''        yaw += yawVelocity * dt;
        if (yaw > MathUtils.PI) yaw -= MathUtils.PI2;
        if (yaw < -MathUtils.PI) yaw += MathUtils.PI2;

        float terrainRollTarget = 0f;
        if (!terrainAirborne && terrainVisuals != null) {
            float slopeX = terrainVisuals.groundSlopeX(bikeX, bikeZ);
            float slopeZ = terrainVisuals.groundSlopeZ(bikeX, bikeZ);
            float lateralGrade = slopeX * MathUtils.cos(yaw) - slopeZ * MathUtils.sin(yaw);
            terrainRollTarget = (float) Math.atan(lateralGrade);
        }
        float terrainRollAcceleration = (terrainRollTarget - terrainRoll)
                * TERRAIN_ROLL_NATURAL_FREQUENCY * TERRAIN_ROLL_NATURAL_FREQUENCY
                - 2f * TERRAIN_ROLL_DAMPING_RATIO * TERRAIN_ROLL_NATURAL_FREQUENCY
                * terrainRollVelocity;
        terrainRollVelocity += terrainRollAcceleration * dt;
        terrainRollVelocity = MathUtils.clamp(terrainRollVelocity, -2.5f, 2.5f);
        terrainRoll += terrainRollVelocity * dt;''', '''        yaw += yawVelocity * dt;
        if (yaw > MathUtils.PI) yaw -= MathUtils.PI2;
        if (yaw < -MathUtils.PI) yaw += MathUtils.PI2;

        if (terrainAirborne) {
            // World-space translation is ballistic. Convert it back into the bike frame only for
            // tire/rider state and HUD use; rotating the chassis no longer rotates its trajectory.
            float airSinYaw = MathUtils.sin(yaw);
            float airCosYaw = MathUtils.cos(yaw);
            speed = airSinYaw * airborneVelocityX + airCosYaw * airborneVelocityZ;
            lateralSpeed = airCosYaw * airborneVelocityX - airSinYaw * airborneVelocityZ;
            lateralDynamics.syncAirborneVelocity(lateralSpeed);

            // A side-sloped or crooked lip should carry its roll attitude into flight rather than
            // being invisibly spring-centred to zero as soon as both wheels leave the dirt.
            terrainRollVelocity *= Math.max(0f, 1f - dt * 0.10f);
            terrainRoll += terrainRollVelocity * dt;
        } else {
            float terrainRollTarget = 0f;
            if (terrainVisuals != null) {
                float slopeX = terrainVisuals.groundSlopeX(bikeX, bikeZ);
                float slopeZ = terrainVisuals.groundSlopeZ(bikeX, bikeZ);
                float lateralGrade = slopeX * MathUtils.cos(yaw) - slopeZ * MathUtils.sin(yaw);
                terrainRollTarget = (float) Math.atan(lateralGrade);
            }
            float terrainRollAcceleration = (terrainRollTarget - terrainRoll)
                    * TERRAIN_ROLL_NATURAL_FREQUENCY * TERRAIN_ROLL_NATURAL_FREQUENCY
                    - 2f * TERRAIN_ROLL_DAMPING_RATIO * TERRAIN_ROLL_NATURAL_FREQUENCY
                    * terrainRollVelocity;
            terrainRollVelocity += terrainRollAcceleration * dt;
            terrainRollVelocity = MathUtils.clamp(terrainRollVelocity, -2.5f, 2.5f);
            terrainRoll += terrainRollVelocity * dt;
        }''')

          replace('''        if (landingState.crashRecommended) {
            beginCrash();
            return;
        }

        if (pitch > LOOP_ANGLE
                || Float.isNaN(pitch) || Float.isNaN(speed) || Float.isNaN(lateralSpeed)
                || Float.isNaN(yaw) || Float.isNaN(roll) || Float.isNaN(bikeX)
                || Float.isNaN(bikeZ) || Float.isNaN(chassisY)) {
            beginCrash();
        }''', '''        // Crash only when actual hard parts intersect terrain. The rear fender is not sampled,
        // which intentionally permits fender drags; bars or the underside/back corners of the
        // seat touching are what end the ride.
        if (terrainVisuals != null) {
            float bodySinYaw = MathUtils.sin(yaw);
            float bodyCosYaw = MathUtils.cos(yaw);
            float bodySinPitch = MathUtils.sin(pitch);
            float bodyCosPitch = MathUtils.cos(pitch);
            float rootForward = -effectiveComForward * bodyCosPitch
                    + COM_HEIGHT * bodySinPitch;
            float rootVertical = -effectiveComForward * bodySinPitch
                    - COM_HEIGHT * bodyCosPitch;
            float rootX = bikeX + bodySinYaw * rootForward;
            float rootZ = bikeZ + bodyCosYaw * rootForward;
            float rootY = chassisY + rootVertical;
            if (bodyContact.hitsGround(
                    rootX, rootY, rootZ, yaw, pitch, roll + terrainRoll,
                    (x, z) -> terrainVisuals.groundHeight(x, z))) {
                beginCrash();
                return;
            }
        }

        if (pitch > MathUtils.PI) pitch -= MathUtils.PI2;
        if (pitch < -MathUtils.PI) pitch += MathUtils.PI2;

        if (Float.isNaN(pitch) || Float.isNaN(speed) || Float.isNaN(lateralSpeed)
                || Float.isNaN(yaw) || Float.isNaN(roll) || Float.isNaN(bikeX)
                || Float.isNaN(bikeZ) || Float.isNaN(chassisY)) {
            beginCrash();
        }''')

          replace('''    private void beginCrash() {''', '''    private static float wrapAngle(float angle) {
        while (angle > MathUtils.PI) angle -= MathUtils.PI2;
        while (angle < -MathUtils.PI) angle += MathUtils.PI2;
        return angle;
    }

    private void beginCrash() {''')

          replace('''        lastGroundSupportPitch = 0f;
        groundSupportPitchRate = 0f;
        longitudinalAcceleration = 0f;''', '''        lastGroundSupportPitch = 0f;
        groundSupportPitchRate = 0f;
        airborneVelocityX = 0f;
        airborneVelocityZ = 0f;
        longitudinalAcceleration = 0f;''')

          path.write_text(s)

          # Landing impacts are diagnostics now; hard-part contact owns crash authority.
          test = Path('core/src/test/java/com/nyerahworks/balancepoint/MotorcycleLandingDynamicsTest.java')
          t = test.read_text()
          t = t.replace('public void violentFrontFirstStrikeCanCrash()',
                        'public void violentFrontFirstStrikeIsTrackedButDoesNotAutoCrash()')
          t = t.replace('''        assertTrue(result.crashRecommended);''',
                        '''        assertFalse(result.crashRecommended);''', 1)
          t = t.replace('''        assertTrue(frontSlap.crashRecommended);''',
                        '''        assertFalse(frontSlap.crashRecommended);''')
          test.write_text(t)

          rider_test = Path('core/src/test/java/com/nyerahworks/balancepoint/MotorcycleRiderDynamicsTest.java')
          rt = rider_test.read_text()
          rt = rt.replace('''        assertTrue(Math.abs(torque) <= 180f);''',
                          '''        assertTrue(Math.abs(torque) <= 360f);\n        assertTrue(Math.abs(torque) >= 300f);''')
          rider_test.write_text(rt)

          lateral_test = Path('core/src/test/java/com/nyerahworks/balancepoint/MotorcycleLateralDynamicsTest.java')
          lt = lateral_test.read_text()
          anchor = '''    @Test
    public void releasedSteeringRecapturesSidewaysMotionQuickly() {'''
          addition = '''    @Test
    public void airborneStatePreservesSideslipAndRollMomentum() {
        MotorcycleLateralDynamics dynamics = new MotorcycleLateralDynamics(
                198f, 1.403232f, 0.636107f, 9.81f);

        for (int i = 0; i < 70; i++) {
            dynamics.step(15f, 0.75f, 0f,
                    1050f, 890f, 1f, 1f,
                    true, true, DT);
        }
        float takeoffRoll = dynamics.roll();
        dynamics.syncAirborneVelocity(1.25f);

        for (int i = 0; i < 30; i++) {
            dynamics.step(15f, 0f, 0f,
                    0f, 0f, 1f, 1f,
                    false, false, DT);
            dynamics.syncAirborneVelocity(1.25f);
        }

        assertEquals(1.25f, dynamics.lateralSpeed(), 0.0001f);
        assertTrue(Math.abs(dynamics.roll()) > Math.abs(takeoffRoll) * 0.50f);
    }

'''
          if anchor not in lt:
              raise SystemExit('Lateral-test anchor not found')
          lateral_test.write_text(lt.replace(anchor, addition + anchor, 1))

          body_test = Path('core/src/test/java/com/nyerahworks/balancepoint/MotorcycleBodyContactTest.java')
          body_test.write_text('''package com.nyerahworks.balancepoint;\n\nimport static org.junit.Assert.assertFalse;\nimport static org.junit.Assert.assertTrue;\n\nimport com.badlogic.gdx.math.MathUtils;\nimport org.junit.Test;\n\npublic final class MotorcycleBodyContactTest {\n    private final MotorcycleBodyContact contact = new MotorcycleBodyContact();\n    private final MotorcycleBodyContact.GroundHeightSampler flat = (x, z) -> 0f;\n\n    @Test\n    public void normalRidingDoesNotTouchHardParts() {\n        assertFalse(contact.hitsGround(\n                0f, 0.335f, 0f, 0f, 0f, 0f, flat));\n    }\n\n    @Test\n    public void rearFenderCanScrapeBeforeSeatBecomesCrashPoint() {\n        // A deep wheelie can rotate well past vertical before the seat underside reaches flat\n        // ground. Rear-fender geometry is deliberately absent from the hard-point set.\n        assertFalse(contact.hitsGround(\n                0f, 0.335f, 0f, 0f, 105f * MathUtils.degreesToRadians, 0f, flat));\n        assertTrue(contact.hitsGround(\n                0f, 0.335f, 0f, 0f, 145f * MathUtils.degreesToRadians, 0f, flat));\n    }\n\n    @Test\n    public void noseDownHandlebarStrikeCrashes() {\n        assertTrue(contact.hitsGround(\n                0f, 0.335f, 0f, 0f, -80f * MathUtils.degreesToRadians, 0f, flat));\n    }\n}\n''')
          PY

      - name: Commit integrated physics
        shell: bash
        run: |
          git config user.name "Matthew Talafous"
          git config user.email "68287092+NyerahMT@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java \
                  core/src/test/java/com/nyerahworks/balancepoint/MotorcycleLandingDynamicsTest.java \
                  core/src/test/java/com/nyerahworks/balancepoint/MotorcycleRiderDynamicsTest.java \
                  core/src/test/java/com/nyerahworks/balancepoint/MotorcycleLateralDynamicsTest.java \
                  core/src/test/java/com/nyerahworks/balancepoint/MotorcycleBodyContactTest.java
          git commit -m "Implement ballistic jumps and contact crashes"
          git push origin HEAD:main
