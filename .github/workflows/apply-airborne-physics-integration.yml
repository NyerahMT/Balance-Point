name: Apply airborne physics integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-airborne-physics-integration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 tools/apply_airborne_physics_integration.py
      - name: Commit integrated physics
        run: |
          git config user.name "Matthew Talafous"
          git config user.email "68287092+NyerahMT@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java \
                  core/src/test/java/com/nyerahworks/balancepoint/MotorcycleLandingDynamicsTest.java \
                  core/src/test/java/com/nyerahworks/balancepoint/MotorcycleRiderDynamicsTest.java \
                  core/src/test/java/com/nyerahworks/balancepoint/MotorcycleLateralDynamicsTest.java \
                  core/src/test/java/com/nyerahworks/balancepoint/MotorcycleBodyContactTest.java
          git commit -m "Implement ballistic jumps and contact crashes"
          git push origin HEAD:main
