name: One-shot helmet camera pitch fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-helmet-camera-pitch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decouple helmet pitch from chassis
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java')
          s = p.read_text()
          old = '''            // Helmet view lives in the motorcycle's local frame. Roll and pitch therefore
            // follow banks, hills and jumps instead of being artificially horizon-locked.
            float cp = MathUtils.cos(lookPitch);
            camera.direction.set(MathUtils.sin(lookYaw) * cp,
                    MathUtils.sin(lookPitch), MathUtils.cos(lookYaw) * cp)
                    .rot(bikeRoot).nor();
            camera.up.set(Vector3.Y).rot(bikeRoot).nor();
            camera.fieldOfView = 80f;
'''
          new = '''            // Helmet position follows the motorcycle, but a rider does not point their eyes
            // uphill/downhill just because the chassis pitches. Keep view pitch referenced to
            // the horizon while preserving bike-relative yaw and bank/sidehill roll.
            float cp = MathUtils.cos(lookPitch);
            camera.direction.set(MathUtils.sin(viewYaw) * cp,
                    MathUtils.sin(lookPitch), MathUtils.cos(viewYaw) * cp).nor();

            float terrainSlopeX = terrainVisuals != null
                    ? terrainVisuals.groundSlopeX(bikeX, bikeZ) : 0f;
            float terrainSlopeZ = terrainVisuals != null
                    ? terrainVisuals.groundSlopeZ(bikeX, bikeZ) : 0f;
            float terrainLateralGrade = terrainSlopeX * MathUtils.cos(yaw)
                    - terrainSlopeZ * MathUtils.sin(yaw);
            float cameraBank = roll + (terrainAirborne ? 0f
                    : (float) Math.atan(terrainLateralGrade));
            camera.up.set(Vector3.Y)
                    .rotate(camera.direction, cameraBank * MathUtils.radiansToDegrees).nor();
            camera.fieldOfView = 80f;
'''
          if old not in s:
              raise SystemExit('helmet camera block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and clean one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-helmet-camera-pitch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Decouple helmet pitch from chassis attitude'
          git push
