name: One-shot jump and camera dynamics patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/jump_camera_dynamics_patch.py'
      - '.github/workflows/one-shot-jump-camera-dynamics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply jump and camera dynamics patch
        run: python3 .github/scripts/jump_camera_dynamics_patch.py
      - name: Commit patch and clean one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/jump_camera_dynamics_patch.py
          rm .github/workflows/one-shot-jump-camera-dynamics.yml
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java
          git add -u .github/scripts/jump_camera_dynamics_patch.py .github/workflows/one-shot-jump-camera-dynamics.yml
          git commit -m "Add controllable airborne motorcycle dynamics"
          git push
