name: One-shot shadow traction gravity tune

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply tune
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bp = Path('core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java')
          s = bp.read_text()

          old = '''        shadowLight = new DirectionalShadowLight(1024, 1024, 28f, 28f, 0.5f, 70f);
                  shadowLight.set(0.95f, 0.88f, 0.76f, -0.45f, -1f, -0.28f);
                  environment.add(shadowLight);
          '''
          old = old.replace('                  ', '        ')
          new = '''        shadowLight = new DirectionalShadowLight(1024, 1024, 28f, 28f, 0.5f, 70f);
                  shadowLight.set(0.95f, 0.88f, 0.76f, -0.45f, -1f, -0.28f);
                  // Keep the existing 1024 map and libGDX PCF, but soften texel stair-stepping.
                  shadowLight.getDepthMap().minFilter = Texture.TextureFilter.Linear;
                  shadowLight.getDepthMap().magFilter = Texture.TextureFilter.Linear;
                  environment.add(shadowLight);
          '''.replace('                  ', '        ')
          assert old in s, 'shadow block not found'
          s = s.replace(old, new, 1)

          old = '''        if (penetrationCorrection > 0f) {
                      chassisY += Math.min(penetrationCorrection, 0.16f);
                      if (verticalVelocity < 0f) verticalVelocity *= 0.32f;
                  }
          '''.replace('                      ', '            ').replace('                  ', '        ')
          new = '''        if (penetrationCorrection > 0f) {
                      chassisY += Math.min(penetrationCorrection, 0.16f);
                      if (verticalVelocity < 0f) {
                          float correctionBlend = MathUtils.clamp(penetrationCorrection / 0.16f, 0f, 1f);
                          float velocityRetention = MathUtils.lerp(0.92f, 0.58f, correctionBlend);
                          verticalVelocity *= velocityRetention;
                      }
                  }
          '''.replace('                      ', '            ').replace('                  ', '        ')
          assert old in s, 'penetration block not found'
          s = s.replace(old, new, 1)
          bp.write_text(s)

          tv = Path('core/src/main/java/com/nyerahworks/balancepoint/TerrainVisuals.java')
          t = tv.read_text()
          old = '''        // Dry knobby-tire prototype values: asphalt 1.00, dirt 0.82, rock 0.72, grass 0.64.
                  return MathUtils.clamp(grass * 0.64f + dirt * 0.82f + rock * 0.72f, 0.60f, 0.86f);
          '''.replace('                  ', '        ')
          new = '''        // Dry MX-knobby peak grip. Loose surfaces still fall off through the slip curve.
                  // Asphalt 1.00 baseline; dirt 0.98, grass 0.94, rock 0.90.
                  return MathUtils.clamp(grass * 0.94f + dirt * 0.98f + rock * 0.90f, 0.88f, 0.985f);
          '''.replace('                  ', '        ')
          assert old in t, 'traction block not found'
          t = t.replace(old, new, 1)
          tv.write_text(t)
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile core
        run: gradle :core:compileJava --stacktrace
      - name: Commit source changes
        run: |
          rm .github/workflows/one-shot-shadow-traction-gravity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java core/src/main/java/com/nyerahworks/balancepoint/TerrainVisuals.java .github/workflows/one-shot-shadow-traction-gravity.yml
          git commit -m 'Soften shadows and improve off-road grip and gravity feel'
          git push origin HEAD:main
