name: Apply V3 Steering Sanity

on:
  push:
    branches: [main]
    paths:
      - tools/apply_v3_steering_sanity.py
      - core/src/test/java/com/nyerahworks/balancepoint/PhysicsV3SteeringControlTest.java
      - .github/workflows/apply-v3-steering-sanity.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply V3 steering sanity pass
        run: python3 tools/apply_v3_steering_sanity.py
      - name: Validate steering sanity pass
        run: |
          python3 tools/quality_gate.py
          ./gradlew :core:test --stacktrace
      - name: Commit V3 steering sanity pass
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/PhysicsV3MultibodyPlant.java
          git commit -m "Make V3 grounded steering direct and stable"
          git push origin main
