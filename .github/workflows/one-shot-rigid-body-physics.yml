name: One-shot rigid body motorcycle physics

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/rigid_body_motorcycle_patch.py'
      - '.github/workflows/one-shot-rigid-body-physics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply rigid body motorcycle physics patch
        run: python3 .github/scripts/rigid_body_motorcycle_patch.py
      - name: Compile core before commit
        run: gradle :core:compileJava --stacktrace
      - name: Commit patch and clean one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/rigid_body_motorcycle_patch.py
          rm .github/workflows/one-shot-rigid-body-physics.yml
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java
          git add -u .github/scripts/rigid_body_motorcycle_patch.py .github/workflows/one-shot-rigid-body-physics.yml
          git commit -m "Replace situational bike dynamics with rigid body contacts"
          git push
