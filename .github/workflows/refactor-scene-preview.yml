name: Scene refactor preview

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/refactor-scene-preview.yml
      - tools/refactor_scene_once.py

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply scene extraction in runner
        run: python3 tools/refactor_scene_once.py

      - name: Repository quality gate
        run: python3 tools/quality_gate.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile and test transformed core
        run: gradle :core:test --stacktrace

      - name: Upload transformed sources
        uses: actions/upload-artifact@v4
        with:
          name: scene-refactor-source
          path: |
            core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java
            core/src/main/java/com/nyerahworks/balancepoint/GameScene.java
