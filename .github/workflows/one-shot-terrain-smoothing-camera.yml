name: One-shot terrain smoothing and helmet camera

on:
  push:
    paths:
      - '.github/workflows/one-shot-terrain-smoothing-camera.yml'
      - 'tools/patch_terrain_smoothing_camera.py'

permissions:
  contents: write

jobs:
  bake-and-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sync current main
        run: git pull --ff-only origin main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply source patch
        run: python3 tools/patch_terrain_smoothing_camera.py

      - name: Bake smoothed terrain assets
        run: |
          mkdir -p build/terrain-baker app/src/main/assets/terrain
          javac -d build/terrain-baker core/src/main/java/com/nyerahworks/balancepoint/FastNoiseLite.java tools/TerrainBaker.java
          java -Xmx1536m -cp build/terrain-baker com.nyerahworks.balancepoint.TerrainBaker app/src/main/assets/terrain
          ls -lh app/src/main/assets/terrain

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile core
        run: gradle :core:compileJava --stacktrace

      - name: Commit baked terrain and source changes
        run: |
          rm -f .github/workflows/one-shot-terrain-smoothing-camera.yml tools/patch_terrain_smoothing_camera.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java \
                  core/src/main/java/com/nyerahworks/balancepoint/TerrainVisuals.java \
                  tools/TerrainBaker.java \
                  app/src/main/assets/terrain/world.bpheight \
                  app/src/main/assets/terrain/world_albedo.png \
                  .github/workflows/one-shot-terrain-smoothing-camera.yml \
                  tools/patch_terrain_smoothing_camera.py
          git commit -m "Smooth terrain and stabilize helmet camera"
          git push
