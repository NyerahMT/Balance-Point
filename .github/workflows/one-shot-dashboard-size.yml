name: One-shot compact dashboard sizing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-dashboard-size.yml"

permissions:
  contents: write

jobs:
  patch-dashboard-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shrink dashboard housing
        run: python tools/patch_dashboard_size.py
      - name: Commit sizing patch and clean one-shot files
        run: |
          rm tools/patch_dashboard_size.py
          rm .github/workflows/one-shot-dashboard-size.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java tools/patch_dashboard_size.py .github/workflows/one-shot-dashboard-size.yml
          git commit -m "Shrink dashboard to dirtbike-computer proportions"
          git push origin HEAD:main
