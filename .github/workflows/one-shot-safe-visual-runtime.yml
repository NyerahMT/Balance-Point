name: One-shot safe visual runtime

on:
  push:
    paths:
      - '.github/workflows/one-shot-safe-visual-runtime.yml'
      - 'tools/patch_safe_visual_runtime.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync current main
        run: git pull --ff-only origin main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply safe runtime patch
        run: python3 tools/patch_safe_visual_runtime.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile core
        run: gradle :core:compileJava --stacktrace
      - name: Commit source changes
        run: |
          rm -f .github/workflows/one-shot-safe-visual-runtime.yml tools/patch_safe_visual_runtime.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java \
                  .github/workflows/one-shot-safe-visual-runtime.yml \
                  tools/patch_safe_visual_runtime.py
          git commit -m "Remove risky runtime sky and fog path"
          git push
