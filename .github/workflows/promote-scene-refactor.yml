name: Promote validated scene refactor

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/promote-scene-refactor.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply already-validated scene transformation
        run: python3 tools/refactor_scene_once.py

      - name: Commit scene extraction atomically
        run: |
          set -euo pipefail
          git config user.name "NyerahMT"
          git config user.email "68287092+NyerahMT@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java
          git add core/src/main/java/com/nyerahworks/balancepoint/GameScene.java
          git diff --cached --check
          git commit -m "Extract world and bike scene presentation"
          git push origin HEAD:main
