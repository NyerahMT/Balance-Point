name: One-shot traction climb posture and trajectory camera

on:
  push:
    paths:
      - '.github/workflows/one-shot-surface-traction-climb-camera.yml'
      - 'tools/patch_surface_traction_climb_camera.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync current main
        run: git pull --ff-only origin main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply physics and camera patch
        run: python3 tools/patch_surface_traction_climb_camera.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile core
        run: gradle :core:compileJava --stacktrace
      - name: Commit source changes
        run: |
          rm -f .github/workflows/one-shot-surface-traction-climb-camera.yml tools/patch_surface_traction_climb_camera.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java \
                  core/src/main/java/com/nyerahworks/balancepoint/TerrainVisuals.java \
                  .github/workflows/one-shot-surface-traction-climb-camera.yml \
                  tools/patch_surface_traction_climb_camera.py
          git commit -m "Add surface traction and trajectory camera"
          git push
