name: One-shot official libGDX shadow pass

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply official libGDX shadow mapping pattern
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java')
          s = p.read_text()

          old = 'import com.badlogic.gdx.graphics.g3d.environment.DirectionalLight;\nimport com.badlogic.gdx.graphics.g3d.utils.ModelBuilder;'
          new = 'import com.badlogic.gdx.graphics.g3d.environment.DirectionalLight;\nimport com.badlogic.gdx.graphics.g3d.environment.DirectionalShadowLight;\nimport com.badlogic.gdx.graphics.g3d.utils.DepthShaderProvider;\nimport com.badlogic.gdx.graphics.g3d.utils.ModelBuilder;'
          assert old in s
          s = s.replace(old, new, 1)

          old = '    private Environment environment;\n    private EngineAudio engineAudio;'
          new = '    private Environment environment;\n    private DirectionalShadowLight shadowLight;\n    private ModelBatch shadowBatch;\n    private EngineAudio engineAudio;'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        environment = new Environment();
        environment.set(new ColorAttribute(ColorAttribute.AmbientLight, 0.62f, 0.65f, 0.63f, 1f));
        environment.add(new DirectionalLight().set(0.95f, 0.88f, 0.76f, -0.45f, -1f, -0.28f));
'''
          new = '''        environment = new Environment();
        environment.set(new ColorAttribute(ColorAttribute.AmbientLight, 0.62f, 0.65f, 0.63f, 1f));
        // Official libGDX shadow-map path: DirectionalShadowLight is both the key light
        // and the Environment ShadowMap. Keep this first pass deliberately local to the bike.
        shadowLight = new DirectionalShadowLight(1024, 1024, 28f, 28f, 0.5f, 70f);
        shadowLight.set(0.95f, 0.88f, 0.76f, -0.45f, -1f, -0.28f);
        environment.add(shadowLight);
        environment.shadowMap = shadowLight;
        shadowBatch = new ModelBatch(new DepthShaderProvider());
'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        Gdx.gl.glClear(GL20.GL_COLOR_BUFFER_BIT | GL20.GL_DEPTH_BUFFER_BIT);

        modelBatch.begin(camera);
'''
          new = '''        Gdx.gl.glClear(GL20.GL_COLOR_BUFFER_BIT | GL20.GL_DEPTH_BUFFER_BIT);

        // Match libGDX's own ShadowMappingTest: render only shadow casters into the depth
        // batch, then render the normal scene with environment.shadowMap receiving it.
        shadowLight.begin(tempC.set(bikeX, bikeY + 0.65f, bikeZ), camera.direction);
        shadowBatch.begin(shadowLight.getCamera());
        renderBikeShadow();
        shadowBatch.end();
        shadowLight.end();
        // Be explicit about restoring the drawable viewport after the FBO pass on mobile.
        Gdx.gl.glViewport(0, 0, Gdx.graphics.getBackBufferWidth(), Gdx.graphics.getBackBufferHeight());

        modelBatch.begin(camera);
'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '    private void renderBike() {\n'
          assert marker in s
          method = '''    private void renderBikeShadow() {
        if (importedBikeLoaded) {
            shadowBatch.render(importedBike.body);
            shadowBatch.render(importedBike.engine);
            shadowBatch.render(importedBike.steering);
            shadowBatch.render(importedBike.rearWheel);
            shadowBatch.render(importedBike.frontWheel);
            return;
        }

        shadowBatch.render(rearWheel); shadowBatch.render(frontWheel);
        shadowBatch.render(rearHub); shadowBatch.render(frontHub);
        shadowBatch.render(frame); shadowBatch.render(tank);
        shadowBatch.render(seat); shadowBatch.render(frontFender);
        shadowBatch.render(forkLeft); shadowBatch.render(forkRight);
        shadowBatch.render(handlebar); shadowBatch.render(frontNumberPlate);
        shadowBatch.render(riderTorso); shadowBatch.render(riderHead);
        shadowBatch.render(riderLegLeft); shadowBatch.render(riderLegRight);
        shadowBatch.render(riderArmLeft); shadowBatch.render(riderArmRight);
    }

'''
          s = s.replace(marker, method + marker, 1)

          old = '''        if (terrainVisuals != null) terrainVisuals.dispose();
        if (modelBatch != null) modelBatch.dispose();
'''
          new = '''        if (terrainVisuals != null) terrainVisuals.dispose();
        if (shadowBatch != null) shadowBatch.dispose();
        if (shadowLight != null) shadowLight.dispose();
        if (modelBatch != null) modelBatch.dispose();
'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile core
        run: gradle :core:compileJava --stacktrace
      - name: Commit source changes
        run: |
          rm .github/workflows/one-shot-official-shadow-pass.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java .github/workflows/one-shot-official-shadow-pass.yml
          git commit -m 'Add official libGDX directional bike shadows'
          git push origin HEAD:main
