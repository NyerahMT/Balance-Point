name: One-shot official libGDX shadow pass

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply official libGDX shadow mapping pattern
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile core
        run: gradle :core:compileJava --stacktrace
      - name: Commit source changes
        run: |
          rm .github/workflows/one-shot-official-shadow-pass.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java .github/workflows/one-shot-official-shadow-pass.yml
          git commit -m 'Add official libGDX directional bike shadows'
          git push origin HEAD:main
