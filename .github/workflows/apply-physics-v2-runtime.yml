name: Apply Physics V2 Runtime

on:
  push:
    branches: [ main ]
    paths:
      - "tools/apply_physics_v2_runtime.py"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Apply deterministic runtime splice
        run: python3 tools/apply_physics_v2_runtime.py

      - name: Validate migrated source
        run: |
          python3 tools/quality_gate.py
          ./gradlew :core:test --stacktrace

      - name: Commit migrated runtime
        run: |
          if git diff --quiet; then
            echo "Runtime splice already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java \
                  core/src/main/java/com/nyerahworks/balancepoint/InstrumentDisplay.java \
                  core/src/main/java/com/nyerahworks/balancepoint/PhysicsV2Plant.java
          git commit -m "Wire Physics V2 into live runtime"
          git push origin HEAD:main
