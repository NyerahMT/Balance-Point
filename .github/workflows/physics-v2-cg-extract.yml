name: Physics V2 CG Extraction

on:
  push:
    paths:
      - 'tools/extract_honda_cg.py'
      - '.github/workflows/physics-v2-cg-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pymupdf numpy opencv-python-headless

      - name: Extract Honda Figure 9 diagnostics
        shell: bash
        run: |
          set -o pipefail
          python tools/extract_honda_cg.py --out-dir cg_extract | tee cg_extract.log

      - name: Upload extraction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-v2-honda-cg-extraction
          path: |
            cg_extract/
            cg_extract.log
          if-no-files-found: warn
          retention-days: 14
