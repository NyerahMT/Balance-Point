name: One-shot terrain disposal patch

on:
  push:
    paths:
      - 'run-terrain-dispose.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire terrain mesh disposal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java')
          s = p.read_text()
          old = '''    public void dispose() {\n        if (engineAudio != null) engineAudio.dispose();'''
          new = '''    public void dispose() {\n        if (engineAudio != null) engineAudio.dispose();\n        if (terrainVisuals != null) terrainVisuals.dispose();'''
          if old not in s:
              raise SystemExit('dispose insertion point not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and clean one-shot files
        run: |
          rm -f .github/workflows/one-shot-terrain-dispose.yml run-terrain-dispose.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Dispose streamed terrain meshes cleanly'
          git push
