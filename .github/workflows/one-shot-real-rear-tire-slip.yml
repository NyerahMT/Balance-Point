name: One-shot real rear tire slip

on:
  push:
    paths:
      - '.github/workflows/one-shot-real-rear-tire-slip.yml'
      - 'tools/patch_real_rear_tire_slip.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Sync current main
        run: git pull --ff-only origin main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply real rear tire slip patch
        run: python3 tools/patch_real_rear_tire_slip.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile core
        run: gradle :core:compileJava --stacktrace

      - name: Commit source changes
        run: |
          rm -f .github/workflows/one-shot-real-rear-tire-slip.yml tools/patch_real_rear_tire_slip.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java \
                  core/src/main/java/com/nyerahworks/balancepoint/MotorcycleDrivetrain.java \
                  .github/workflows/one-shot-real-rear-tire-slip.yml \
                  tools/patch_real_rear_tire_slip.py
          git commit -m "Model rear tire slip instead of limiting power"
          git push
