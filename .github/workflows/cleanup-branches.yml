name: Cleanup Branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            backup-dirtbike-debug-20260916
            cafe-racer-3d
            controls-camera-damping
            dirtbike-clean-import
            dirtbike-source-rebuild
            import-dirtbike-model
            ios-port
            physics-v2
          )

          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done

          remaining="$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[] | select(.name != "main") | .name')"
          if [ -n "$remaining" ]; then
            echo "Non-main branches still remain:"
            echo "$remaining"
            exit 1
          fi

          echo "Only main remains."
