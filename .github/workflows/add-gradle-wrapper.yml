name: Generate pinned Gradle wrapper

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/add-gradle-wrapper.yml

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate wrapper
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          ./gradlew --version

      - name: Commit wrapper atomically
        run: |
          set -euo pipefail
          git config user.name "NyerahMT"
          git config user.email "68287092+NyerahMT@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git diff --cached --check -- . ':(exclude)gradlew.bat'
          git commit -m "Pin Gradle 8.11.1 wrapper"
          git push origin HEAD:main
