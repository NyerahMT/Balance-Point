name: One-shot 450 baseline patch
on:
  push:
    paths:
      - '.github/workflows/one-shot-450-baseline.yml'
      - 'tools/one_shot_450_baseline.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 450 baseline
        run: python3 tools/one_shot_450_baseline.py
      - name: Commit patch and clean one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tools/one_shot_450_baseline.py .github/workflows/one-shot-450-baseline.yml
          git add -A
          git commit -m 'Retune motorcycle to modern 450 baseline'
          git push
