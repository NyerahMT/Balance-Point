name: One-shot quality tier

on:
  push:
    paths:
      - '.github/workflows/one-shot-quality-tier.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync current main
        run: git pull --ff-only origin main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply quality tier patch
        run: python3 tools/patch_quality_tiers.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile core
        run: gradle :core:compileJava --stacktrace
      - name: Commit source changes
        run: |
          rm -f tools/patch_quality_tiers.py .github/workflows/one-shot-quality-tier.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add persistent high low graphics quality modes'
          git push origin main
