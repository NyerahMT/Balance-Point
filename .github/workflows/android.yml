name: Mobile Builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Repository quality gate
        run: python3 tools/quality_gate.py

      - name: Validate DirtBike mesh payload
        run: |
          python3 tools/validate_dirtbike.py
          python3 tools/validate_dirtbike_neutral_pose.py

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Run core unit tests
        run: ./gradlew :core:test --stacktrace

  android:
    name: Android APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stage CC0 skeleton rider asset
        run: python3 tools/fetch_skeleton_rider.py

      - name: Stage generated mobile assets
        run: |
          python3 -m venv .icon-venv
          . .icon-venv/bin/activate
          python -m pip install --disable-pip-version-check Pillow
          python tools/stage_app_icons.py
          python tools/stage_supercross_test_track.py
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s app/src/main/assets/terrain/world.bpheight
          test -s app/src/main/assets/terrain/world_albedo.png

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Stamp unique Android build number
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('app/build.gradle')
          text = p.read_text()
          text, n = re.subn(r'(?m)^\s*versionCode\s+\d+\s*$',
                            f"        versionCode {os.environ['GITHUB_RUN_NUMBER']}", text, count=1)
          if n != 1:
              raise SystemExit('Could not stamp Android versionCode')
          p.write_text(text)
          PY
          grep -n 'versionCode' app/build.gradle

      - name: Restore stable debug signing key
        run: base64 --decode .github/balancepoint-debug.keystore.b64 > .github/balancepoint-debug.keystore

      - name: Build Android debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Stage Android artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk BalancePoint-latest.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: BalancePoint-Android-r${{ github.run_number }}-${{ github.sha }}
          path: BalancePoint-latest.apk

  ios:
    name: iOS Feather-compatible IPA
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stage CC0 skeleton rider asset
        run: python3 tools/fetch_skeleton_rider.py

      - name: Stage generated mobile assets
        run: |
          python3 -m venv .icon-venv
          . .icon-venv/bin/activate
          python -m pip install --disable-pip-version-check Pillow
          python tools/stage_app_icons.py
          python tools/stage_supercross_test_track.py
          test -f ios/data/Icon-60@3x.png
          test -s app/src/main/assets/terrain/world.bpheight
          test -s app/src/main/assets/terrain/world_albedo.png

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Stamp unique iOS build number
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('ios/robovm.properties')
          text = p.read_text()
          text, n = re.subn(r'(?m)^app\.build=.*$',
                            f"app.build={os.environ['GITHUB_RUN_NUMBER']}", text, count=1)
          if n != 1:
              raise SystemExit('Could not stamp iOS app.build')
          p.write_text(text)
          PY
          grep '^app.build=' ios/robovm.properties

      - name: Build native iOS IPA
        run: ./gradlew :ios:createIPA -Probovm.archs=arm64 --stacktrace

      - name: Repackage for Feather
        shell: bash
        run: |
          set -euo pipefail
          RAW_IPA="$(find ios/build/robovm -type f -name '*.ipa' | head -n 1)"
          if [ -z "$RAW_IPA" ]; then
            echo "RoboVM completed without producing an IPA"
            find ios/build -maxdepth 5 -type f -print || true
            exit 1
          fi

          rm -rf feather-package BalancePoint-latest-unsigned.ipa
          mkdir -p feather-package
          ditto -x -k "$RAW_IPA" feather-package
          test -d feather-package/Payload

          APP_COUNT="$(find feather-package/Payload -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          if [ "$APP_COUNT" != "1" ]; then
            echo "Expected exactly one .app in Payload, found $APP_COUNT"
            find feather-package/Payload -maxdepth 2 -print || true
            exit 1
          fi

          APP_PATH="$(find feather-package/Payload -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/Icon-60@2x.png"
          test -f "$APP_PATH/Icon-60@3x.png"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          BUNDLE_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles' "$APP_PATH/Info.plist"
          test -n "$EXECUTABLE_NAME"
          test -n "$BUNDLE_ID"
          test -f "$APP_PATH/$EXECUTABLE_NAME"

          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP_PATH"
          /usr/bin/codesign --verify --deep --strict "$APP_PATH"

          rm -rf feather-package/Symbols
          ditto -c -k --sequesterRsrc --keepParent feather-package/Payload BalancePoint-latest-unsigned.ipa
          test -s BalancePoint-latest-unsigned.ipa
          unzip -t BalancePoint-latest-unsigned.ipa
          echo "Feather-compatible IPA ready: $BUNDLE_ID / $EXECUTABLE_NAME / build $BUNDLE_BUILD"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: BalancePoint-iOS-r${{ github.run_number }}-${{ github.sha }}
          path: BalancePoint-latest-unsigned.ipa

  publish:
    name: Publish rolling test builds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v8
        with:
          name: BalancePoint-Android-r${{ github.run_number }}-${{ github.sha }}
          path: release/android

      - name: Download iOS artifact
        uses: actions/download-artifact@v8
        with:
          name: BalancePoint-iOS-r${{ github.run_number }}-${{ github.sha }}
          path: release/ios

      - name: Publish rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ANDROID=release/android/BalancePoint-latest.apk
          IOS=release/ios/BalancePoint-latest-unsigned.ipa
          test -s "$ANDROID"
          test -s "$IOS"

          if gh release view dev-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload dev-build "$ANDROID" "$IOS" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create dev-build "$ANDROID" "$IOS" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest Test Builds" \
              --notes "Automatically updated Android and iOS development builds from main." \
              --prerelease
          fi
