name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable debug signing key
        run: base64 --decode .github/balancepoint-debug.keystore.b64 > .github/balancepoint-debug.keystore

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalancePoint-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct-download test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BalancePoint-latest.apk
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build BalancePoint-latest.apk --clobber
          else
            gh release create dev-build BalancePoint-latest.apk \
              --title "Latest GMEE Test Build" \
              --notes "Automatically updated development APK from main." \
              --prerelease
          fi
