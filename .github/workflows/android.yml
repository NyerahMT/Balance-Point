name: Mobile Builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair invalid DirtBike Base64 tail
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/assets/models/dirtbike_qmesh_3.txt')
          text = path.read_text().strip()
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          bad = next((i for i, ch in enumerate(text) if ch not in alphabet), None)
          if bad is not None:
              tail = text[bad:]
              if len(tail) > 64:
                  raise SystemExit(f'Refusing to truncate {len(tail)} chars from DirtBike chunk 3')
              print(f'Removing invalid DirtBike tail at char {bad}: {tail!r}')
              path.write_text(text[:bad])
          else:
              print('DirtBike chunk 3 contains only Base64 characters')
          PY
          if ! git diff --quiet -- app/src/main/assets/models/dirtbike_qmesh_3.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/assets/models/dirtbike_qmesh_3.txt
            git commit -m "Repair DirtBike mesh Base64 tail"
            git push origin HEAD:main || echo "Another runner already pushed the repaired asset; continuing with local repair"
          fi

      - name: Validate DirtBike mesh payload
        run: python3 tools/validate_dirtbike.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable debug signing key
        run: base64 --decode .github/balancepoint-debug.keystore.b64 > .github/balancepoint-debug.keystore

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalancePoint-Android
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Android test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BalancePoint-latest.apk
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build BalancePoint-latest.apk --clobber
          else
            gh release create dev-build BalancePoint-latest.apk \
              --title "Latest Test Builds" \
              --notes "Automatically updated Android and iOS development builds from main." \
              --prerelease
          fi

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair invalid DirtBike Base64 tail
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/assets/models/dirtbike_qmesh_3.txt')
          text = path.read_text().strip()
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          bad = next((i for i, ch in enumerate(text) if ch not in alphabet), None)
          if bad is not None:
              tail = text[bad:]
              if len(tail) > 64:
                  raise SystemExit(f'Refusing to truncate {len(tail)} chars from DirtBike chunk 3')
              print(f'Removing invalid DirtBike tail at char {bad}: {tail!r}')
              path.write_text(text[:bad])
          else:
              print('DirtBike chunk 3 contains only Base64 characters')
          PY
          if ! git diff --quiet -- app/src/main/assets/models/dirtbike_qmesh_3.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/assets/models/dirtbike_qmesh_3.txt
            git commit -m "Repair DirtBike mesh Base64 tail"
            git push origin HEAD:main || echo "Another runner already pushed the repaired asset; continuing with local repair"
          fi

      - name: Validate DirtBike mesh payload
        run: python3 tools/validate_dirtbike.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build native iOS IPA
        run: gradle :ios:createIPA -Probovm.archs=arm64 --stacktrace

      - name: Verify IPA output
        shell: bash
        run: |
          IPA_PATH="$(find ios/build/robovm -type f -name '*.ipa' | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "RoboVM completed without producing an IPA"
            find ios/build -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "IPA produced at $IPA_PATH"
          cp "$IPA_PATH" BalancePoint-latest-unsigned.ipa
          test -s BalancePoint-latest-unsigned.ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalancePoint-iOS-unsigned
          path: BalancePoint-latest-unsigned.ipa

      - name: Publish unsigned iOS test IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build BalancePoint-latest-unsigned.ipa --clobber
          else
            gh release create dev-build BalancePoint-latest-unsigned.ipa \
              --title "Latest Test Builds" \
              --notes "Automatically updated Android and iOS development builds from main." \
              --prerelease
          fi
