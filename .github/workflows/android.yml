name: Mobile Builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate DirtBike mesh payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib

          root = Path('app/src/main/assets/models')
          chunks = sorted(root.glob('dirtbike_qmesh_*.txt'), key=lambda p: int(p.stem.rsplit('_', 1)[1]))
          indices = [int(p.stem.rsplit('_', 1)[1]) for p in chunks]
          if indices != list(range(len(chunks))):
              raise SystemExit(f'Non-contiguous DirtBike chunks: {indices}')
          if not chunks:
              raise SystemExit('No DirtBike mesh chunks found')

          encoded = ''.join(p.read_text().strip() for p in chunks)
          encoded += '=' * ((-len(encoded)) % 4)
          compressed = base64.b64decode(encoded, validate=True)
          raw = zlib.decompress(compressed)
          if raw[:4] != b'BPQ1':
              raise SystemExit(f'Bad DirtBike magic: {raw[:4]!r}')
          if len(raw) < 5 or raw[4] != 4:
              raise SystemExit(f'Expected 4 DirtBike meshes, got {raw[4] if len(raw) > 4 else "missing"}')
          print(f'DirtBike payload OK: {len(chunks)} chunks, {len(compressed)} compressed bytes, {len(raw)} unpacked bytes, 4 meshes')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable debug signing key
        run: base64 --decode .github/balancepoint-debug.keystore.b64 > .github/balancepoint-debug.keystore

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalancePoint-Android
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Android test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BalancePoint-latest.apk
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build BalancePoint-latest.apk --clobber
          else
            gh release create dev-build BalancePoint-latest.apk \
              --title "Latest Test Builds" \
              --notes "Automatically updated Android and iOS development builds from main." \
              --prerelease
          fi

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate DirtBike mesh payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib

          root = Path('app/src/main/assets/models')
          chunks = sorted(root.glob('dirtbike_qmesh_*.txt'), key=lambda p: int(p.stem.rsplit('_', 1)[1]))
          indices = [int(p.stem.rsplit('_', 1)[1]) for p in chunks]
          if indices != list(range(len(chunks))):
              raise SystemExit(f'Non-contiguous DirtBike chunks: {indices}')
          if not chunks:
              raise SystemExit('No DirtBike mesh chunks found')

          encoded = ''.join(p.read_text().strip() for p in chunks)
          encoded += '=' * ((-len(encoded)) % 4)
          compressed = base64.b64decode(encoded, validate=True)
          raw = zlib.decompress(compressed)
          if raw[:4] != b'BPQ1':
              raise SystemExit(f'Bad DirtBike magic: {raw[:4]!r}')
          if len(raw) < 5 or raw[4] != 4:
              raise SystemExit(f'Expected 4 DirtBike meshes, got {raw[4] if len(raw) > 4 else "missing"}')
          print(f'DirtBike payload OK: {len(chunks)} chunks, {len(compressed)} compressed bytes, {len(raw)} unpacked bytes, 4 meshes')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build native iOS IPA
        run: gradle :ios:createIPA -Probovm.archs=arm64 --stacktrace

      - name: Verify IPA output
        shell: bash
        run: |
          IPA_PATH="$(find ios/build/robovm -type f -name '*.ipa' | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "RoboVM completed without producing an IPA"
            find ios/build -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "IPA produced at $IPA_PATH"
          cp "$IPA_PATH" BalancePoint-latest-unsigned.ipa
          test -s BalancePoint-latest-unsigned.ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalancePoint-iOS-unsigned
          path: BalancePoint-latest-unsigned.ipa

      - name: Publish unsigned iOS test IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build BalancePoint-latest-unsigned.ipa --clobber
          else
            gh release create dev-build BalancePoint-latest-unsigned.ipa \
              --title "Latest Test Builds" \
              --notes "Automatically updated Android and iOS development builds from main." \
              --prerelease
          fi
