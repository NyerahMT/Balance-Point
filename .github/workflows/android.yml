name: Mobile Builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: One-shot cleanup probe
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/repo-cleanup-temp" || true

      - name: Validate DirtBike mesh payload
        run: |
          python3 tools/validate_dirtbike.py
          python3 tools/validate_dirtbike_neutral_pose.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Stamp unique Android build number
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('app/build.gradle')
          text = p.read_text()
          text, n = re.subn(r'(?m)^\s*versionCode\s+\d+\s*$',
                            f"        versionCode {os.environ['GITHUB_RUN_NUMBER']}", text, count=1)
          if n != 1:
              raise SystemExit('Could not stamp Android versionCode')
          p.write_text(text)
          PY
          grep -n 'versionCode' app/build.gradle

      - name: Restore stable debug signing key
        run: base64 --decode .github/balancepoint-debug.keystore.b64 > .github/balancepoint-debug.keystore

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalancePoint-Android-r${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Android test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BalancePoint-latest.apk
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build BalancePoint-latest.apk --clobber
          else
            gh release create dev-build BalancePoint-latest.apk \
              --title "Latest Test Builds" \
              --notes "Automatically updated Android and iOS development builds from main." \
              --prerelease
          fi
          echo "Published rolling Android test build with versionCode ${GITHUB_RUN_NUMBER}"

  ios:
    name: iOS Feather-compatible IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate DirtBike mesh payload
        run: |
          python3 tools/validate_dirtbike.py
          python3 tools/validate_dirtbike_neutral_pose.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Stamp unique iOS build number
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('ios/robovm.properties')
          text = p.read_text()
          text, n = re.subn(r'(?m)^app\.build=.*$',
                            f"app.build={os.environ['GITHUB_RUN_NUMBER']}", text, count=1)
          if n != 1:
              raise SystemExit('Could not stamp iOS app.build')
          p.write_text(text)
          PY
          grep '^app.build=' ios/robovm.properties

      - name: Build native iOS IPA
        run: gradle :ios:createIPA -Probovm.archs=arm64 --stacktrace

      - name: Repackage for Feather
        shell: bash
        run: |
          set -euo pipefail
          RAW_IPA="$(find ios/build/robovm -type f -name '*.ipa' | head -n 1)"
          if [ -z "$RAW_IPA" ]; then
            echo "RoboVM completed without producing an IPA"
            find ios/build -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "Raw RoboVM IPA: $RAW_IPA"
          rm -rf feather-package BalancePoint-latest-unsigned.ipa
          mkdir -p feather-package
          ditto -x -k "$RAW_IPA" feather-package

          test -d feather-package/Payload
          APP_COUNT="$(find feather-package/Payload -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          if [ "$APP_COUNT" != "1" ]; then
            echo "Expected exactly one .app in Payload, found $APP_COUNT"
            find feather-package/Payload -maxdepth 2 -print || true
            exit 1
          fi

          APP_PATH="$(find feather-package/Payload -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -f "$APP_PATH/Info.plist"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          BUNDLE_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          test -n "$EXECUTABLE_NAME"
          test -n "$BUNDLE_ID"
          test -f "$APP_PATH/$EXECUTABLE_NAME"

          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP_PATH"
          /usr/bin/codesign --verify --deep --strict "$APP_PATH"

          rm -rf feather-package/Symbols
          ditto -c -k --sequesterRsrc --keepParent feather-package/Payload BalancePoint-latest-unsigned.ipa

          test -s BalancePoint-latest-unsigned.ipa
          unzip -t BalancePoint-latest-unsigned.ipa
          echo "Feather-compatible IPA ready: $BUNDLE_ID / $EXECUTABLE_NAME / build $BUNDLE_BUILD"
          du -h BalancePoint-latest-unsigned.ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalancePoint-iOS-r${{ github.run_number }}-${{ github.sha }}
          path: BalancePoint-latest-unsigned.ipa

      - name: Publish unsigned iOS test IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build BalancePoint-latest-unsigned.ipa --clobber
          else
            gh release create dev-build BalancePoint-latest-unsigned.ipa \
              --title "Latest Test Builds" \
              --notes "Automatically updated Android and iOS development builds from main." \
              --prerelease
          fi
          echo "Published rolling iOS test build with CFBundleVersion ${GITHUB_RUN_NUMBER}"
