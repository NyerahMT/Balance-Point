name: Mobile Builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply iOS fullscreen viewport fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          game = Path('core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java')
          text = game.read_text()
          old = 'Gdx.gl.glViewport(0, 0, Gdx.graphics.getWidth(), Gdx.graphics.getHeight());'
          new = 'Gdx.gl.glViewport(0, 0, Gdx.graphics.getBackBufferWidth(), Gdx.graphics.getBackBufferHeight());'
          if old in text:
              text = text.replace(old, new, 1)
              game.write_text(text)
          elif new not in text:
              raise SystemExit('viewport call not found')

          plist = Path('ios/Info.plist.xml')
          text = plist.read_text()
          if '<key>UILaunchScreen</key>' not in text:
              marker = '    <key>UIRequiresFullScreen</key>\n'
              if marker not in text:
                  raise SystemExit('plist insertion marker not found')
              text = text.replace(marker, '    <key>UILaunchScreen</key>\n    <dict/>\n' + marker, 1)
              plist.write_text(text)
          PY

      - name: Persist viewport fix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java ios/Info.plist.xml
          if ! git diff --cached --quiet; then
            git commit -m "Fix iOS fullscreen and Retina viewport [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable debug signing key
        run: base64 --decode .github/balancepoint-debug.keystore.b64 > .github/balancepoint-debug.keystore

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalancePoint-Android
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Android test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BalancePoint-latest.apk
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build BalancePoint-latest.apk --clobber
          else
            gh release create dev-build BalancePoint-latest.apk \
              --title "Latest Test Builds" \
              --notes "Automatically updated Android and iOS development builds from main." \
              --prerelease
          fi

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply iOS fullscreen viewport fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          game = Path('core/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java')
          text = game.read_text()
          old = 'Gdx.gl.glViewport(0, 0, Gdx.graphics.getWidth(), Gdx.graphics.getHeight());'
          new = 'Gdx.gl.glViewport(0, 0, Gdx.graphics.getBackBufferWidth(), Gdx.graphics.getBackBufferHeight());'
          if old in text:
              text = text.replace(old, new, 1)
              game.write_text(text)
          elif new not in text:
              raise SystemExit('viewport call not found')

          plist = Path('ios/Info.plist.xml')
          text = plist.read_text()
          if '<key>UILaunchScreen</key>' not in text:
              marker = '    <key>UIRequiresFullScreen</key>\n'
              if marker not in text:
                  raise SystemExit('plist insertion marker not found')
              text = text.replace(marker, '    <key>UILaunchScreen</key>\n    <dict/>\n' + marker, 1)
              plist.write_text(text)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build native iOS IPA
        run: gradle :ios:createIPA -Probovm.archs=arm64 --stacktrace

      - name: Verify IPA output
        shell: bash
        run: |
          IPA_PATH="$(find ios/build/robovm -type f -name '*.ipa' | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "RoboVM completed without producing an IPA"
            find ios/build -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "IPA produced at $IPA_PATH"
          cp "$IPA_PATH" BalancePoint-latest-unsigned.ipa
          test -s BalancePoint-latest-unsigned.ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalancePoint-iOS-unsigned
          path: BalancePoint-latest-unsigned.ipa

      - name: Publish unsigned iOS test IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build BalancePoint-latest-unsigned.ipa --clobber
          else
            gh release create dev-build BalancePoint-latest-unsigned.ipa \
              --title "Latest Test Builds" \
              --notes "Automatically updated Android and iOS development builds from main." \
              --prerelease
          fi
