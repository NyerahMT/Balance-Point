name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Tune rear brake feel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java')
          text = path.read_text()
          replacements = [
              ('    private static final float MAX_REAR_BRAKE_FORCE = 3200f;',
               '    private static final float MAX_REAR_BRAKE_FORCE = 3800f;'),
              ('                float brake = MathUtils.clamp((y - 0.70f) / 0.24f, 0.35f, 1f);',
               '                float brake = MathUtils.clamp((y - 0.70f) / 0.24f, 0.50f, 1f);'),
              ('        rearBrake = approach(rearBrake, rearBrakeTarget,\n                (rearBrakeTarget > rearBrake ? 16f : 20f) * dt);',
               '        rearBrake = approach(rearBrake, rearBrakeTarget,\n                (rearBrakeTarget > rearBrake ? 24f : 22f) * dt);'),
              ('            rearNormalEstimate = MASS * GRAVITY * Math.max(0.20f, MathUtils.cos(pitch));',
               '            rearNormalEstimate = MASS * GRAVITY;'),
              ('            brakeForce = Math.min(MAX_REAR_BRAKE_FORCE * rearBrake, tractionLimit * 0.95f);',
               '            brakeForce = Math.min(MAX_REAR_BRAKE_FORCE * rearBrake, tractionLimit * 0.98f);'),
          ]
          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit('Expected brake source pattern not found:\n' + old)
          if changed:
              path.write_text(text)
          PY

      - name: Commit rear brake tuning
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- app/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java
            git commit -m "Sharpen rear brake feel [skip ci]"
            git push
          fi

      - name: Restore stable debug signing key
        run: base64 --decode .github/balancepoint-debug.keystore.b64 > .github/balancepoint-debug.keystore

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalancePoint-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct-download test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BalancePoint-latest.apk
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build BalancePoint-latest.apk --clobber
          else
            gh release create dev-build BalancePoint-latest.apk \
              --title "Latest GMEE Test Build" \
              --notes "Automatically updated development APK from main." \
              --prerelease
          fi