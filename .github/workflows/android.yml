name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply swapped arrow controls
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          path = Path('app/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java')
          text = path.read_text()

          new_input = base64.b64decode('').decode()
          new_hud = base64.b64decode('').decode()

          start = text.index('    private void readInput(float dt) {')
          end = text.index('    private static float approach(', start)
          text = text[:start] + new_input + text[end:]

          hud_start = text.index('        // Left throttle slider.')
          hud_end = text.index('        shapes.setColor(0f, 0f, 0f, 0.42f);', hud_start)
          text = text[:hud_start] + new_hud + text[hud_end:]

          old_labels = '        font.draw(spriteBatch, "THROTTLE", sliderX - 31f, sliderTop + 22f);\n        font.draw(spriteBatch, "BRAKE", brakeX - 23f, brakeY + 5f);\n        font.draw(spriteBatch, "LEAN", joyX - 21f, joyY + 5f);'
          new_labels = '        font.draw(spriteBatch, "THROTTLE", sliderX - 31f, sliderTop + 22f);\n        font.draw(spriteBatch, "BRAKE", brakeX - 23f, brakeY + 5f);\n        font.draw(spriteBatch, "STEER", w * 0.145f, steerY + steerR + 20f);'
          if old_labels not in text:
              raise SystemExit('HUD label block not found')
          text = text.replace(old_labels, new_labels, 1)

          path.write_text(text)
          PY

      - name: Commit swapped control source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- app/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/nyerahworks/balancepoint/BalancePointGame.java
            git commit -m "Swap to steering arrows and right-side throttle [skip ci]"
            git push
          fi

      - name: Restore stable debug signing key
        run: base64 --decode .github/balancepoint-debug.keystore.b64 > .github/balancepoint-debug.keystore

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalancePoint-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct-download test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BalancePoint-latest.apk
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build BalancePoint-latest.apk --clobber
          else
            gh release create dev-build BalancePoint-latest.apk \
              --title "Latest GMEE Test Build" \
              --notes "Automatically updated development APK from main." \
              --prerelease
          fi